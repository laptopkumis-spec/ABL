server.port=8085
spring.application.name=email-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.initial-status=UP
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Konfigurasi RabbitMQ (event bus CQRS)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ============================================================
# Konfigurasi Email (SMTP) — nilai RAHASIA ada di file terpisah
# application-local.properties (TIDAK ikut di-commit ke Git).
# File itu berisi:
#   spring.mail.username=akun@gmail.com
#   spring.mail.password=app-password-16-digit
#   app.mail.to=email-tujuan@gmail.com
# ============================================================
spring.config.import=optional:file:./application-local.properties

# --- default SMTP (Gmail) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Alamat email tujuan notifikasi (bisa di-override di application-local.properties)
app.mail.to=

server.port=8080
spring.application.name=produk-service
# Konfigurasi Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.initial-status=UP
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# Konfigurasi H2
spring.datasource.url=jdbc:h2:mem:produk:DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Agar konsol H2 bisa diakses di browser (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Menampilkan SQL di console untuk debugging
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update